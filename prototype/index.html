<title>OnePort CRM Deals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed dark-green rail + top bar, content area switches between pipeline board, deal, RFQ and quote views.
   Single light look on purpose: it mirrors the live OnePort CRM screens. */
:root {
  color-scheme: light;
  --rail: #0d3b1d;
  --ink: #12301d;
  --ink-2: #3c4a40;
  --muted: #7a8278;
  --bg: #f5f5f1;
  --surface: #ffffff;
  --surface-2: #f6f6f2;
  --line: #e6e7e0;
  --lime: #c6f04d;
  --lime-soft: #edf8d6;
  --lime-ink: #2f6a12;
  --gold: #c99a06;
  --green: #1f7a32;
  --green-soft: #e4f4e3;
  --red: #b4322a;
  --red-soft: #fbe9e7;
  --amber: #9a6a00;
  --amber-soft: #fff3d6;
  --blue: #22579a;
  --blue-soft: #e5eefb;
  --font: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

.app { display: flex; min-height: 100%; }
.rail { width: 70px; flex: none; background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px 0 20px; position: sticky; top: 0; height: 100vh; }
.rail .home { width: 40px; height: 40px; border-radius: 10px; background: #f3b81c; display: grid; place-items: center; margin-bottom: 14px; }
.rail .ico { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: #dfe9df; }
.rail .ico.on { background: rgba(255,255,255,.09); }
.rail .me { margin-top: auto; width: 34px; height: 34px; border-radius: 50%; background: #3aa34c; color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { background: var(--surface); display: flex; align-items: center; gap: 12px; padding-block: 18px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.topbar .crm-pill { background: var(--rail); color: #fff; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 8px; }
.topbar h1 { font-size: 15px; margin: 0; font-weight: 700; }
.wordmark { margin-left: auto; font-weight: 600; color: var(--rail); font-size: 18px; letter-spacing: -.2px; }
.wordmark b { font-weight: 800; }
.content { padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0; }

/* tabs */
.tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 12px 16px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--ink); font-weight: 500; border-bottom-color: var(--rail); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px; position: relative; }
.stat.hl { background: #eef5e6; }
.stat .lbl { font-size: 13px; color: var(--ink-2); }
.stat .val { font-size: 24px; font-weight: 700; margin: 14px 0 4px; }
.stat .val.gold { color: var(--gold); }
.stat .sub { font-size: 12.5px; color: var(--ink-2); }
.stat .badge-ico { position: absolute; right: 16px; top: 16px; width: 28px; height: 28px; border-radius: 7px; background: var(--lime-soft); display: grid; place-items: center; color: var(--lime-ink); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.search { flex: 1 1 280px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; height: 40px; min-width: 0; }
.search input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; }
.sel { height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 12px; min-width: 150px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 16px; height: 38px; }
.seg button.on { background: var(--rail); color: #fff; font-weight: 600; }
.btn { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--lime); border-color: var(--lime); color: var(--rail); font-weight: 600; }
.btn.dark { background: var(--rail); border-color: var(--rail); color: #fff; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
a.btn { text-decoration: none; color: var(--ink); }
.count { font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; }

/* board */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(250px, 1fr)); gap: 20px; min-width: 1310px; }
.col-h { padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.col-h .t { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; }
.col-h .n { width: 20px; height: 20px; border-radius: 50%; background: var(--lime); font-size: 11px; display: grid; place-items: center; font-weight: 700; }
.col-h .n.dk { background: var(--rail); color: #fff; }
.col-h .m { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0; box-shadow: 0 1px 2px rgba(16,40,20,.05); width: 100%; transition: box-shadow .15s, border-color .15s; }
.col { border-radius: 12px; transition: background .15s, box-shadow .15s; }
.col.over { background: #eef6e2; box-shadow: 0 0 0 2px var(--lime) inset; }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .45; }
.card.ghost { position: fixed; z-index: 70; pointer-events: none; opacity: .95; box-shadow: 0 12px 30px rgba(16,40,20,.25); transform: rotate(2deg); }
.card:hover { border-color: #cfd8c8; box-shadow: 0 4px 14px rgba(16,40,20,.08); }
.card .top { padding: 12px 14px 12px; border-bottom: 1px solid var(--line); }
.card .did { font-size: 11px; color: var(--muted); letter-spacing: .3px; margin-bottom: 4px; }
.card .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .nm { font-weight: 600; font-size: 14px; }
.card .amt { font-weight: 600; color: var(--gold); white-space: nowrap; }
.card .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
.owner { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.av { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 9.5px; font-weight: 600; display: grid; place-items: center; flex: none; }
.card .bot { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.links { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 12px; }

.cls { font-size: 10.5px; border-radius: 999px; padding: 2px 9px; border: 1px solid; font-weight: 500; white-space: nowrap; }
.cls.Growth { color: #c37a00; border-color: #f0c77a; background: #fffaf0; }
.cls.SME { color: var(--ink-2); border-color: #c9cdc5; background: var(--surface-2); }
.cls.Enterprise { color: var(--green); border-color: #9fd3a3; background: var(--green-soft); }
.pill { font-size: 11.5px; border-radius: 6px; padding: 3px 9px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.pill.won { background: var(--green-soft); color: var(--green); }
.pill.lost { background: var(--red-soft); color: var(--red); }
.pill.stage { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.quoting { background: var(--green-soft); color: var(--green); }
.pill.issued { background: var(--blue-soft); color: var(--blue); }
.pill.new { background: var(--amber-soft); color: var(--amber); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; letter-spacing: .2px; }
.chip.rfq { background: var(--lime-soft); color: var(--lime-ink); }
.chip.quote { background: var(--blue-soft); color: var(--blue); }
a.chip, button.chip { border: 0; text-decoration: none; }

/* list */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; min-width: 900px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #fafbf7; }

/* detail pages */
.back { background: none; border: 0; color: var(--green); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; margin-bottom: 16px; }
.back.grey { color: var(--ink-2); font-weight: 400; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.head h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; text-wrap: balance; }
.head .ids { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.idtag { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; letter-spacing: .3px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.sec-t { font-size: 11.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-2); margin: 0 0 20px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 24px; }
.kv .k { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
.kv .v { font-size: 14.5px; }
.kv .v.gold { color: var(--gold); font-weight: 600; }
.kv .full { grid-column: 1 / -1; }
.note { background: var(--surface-2); border-radius: 8px; padding: 16px 18px; min-height: 90px; color: var(--ink-2); }
.so { display: flex; gap: 10px; align-items: center; }
.so .av { width: 34px; height: 34px; border-radius: 8px; font-size: 12px; background: var(--rail) !important; color: var(--lime); }
.so b { display: block; font-size: 13.5px; font-weight: 600; }
.so small { font-size: 11.5px; color: var(--ink-2); }

/* linked tree */
.lk-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.lk-head .sec-t { margin: 0; }
.lk-sum { font-size: 12.5px; color: var(--ink-2); margin-bottom: 18px; }
.tree { display: flex; flex-direction: column; gap: 14px; }
.node { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.node-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex-wrap: wrap; }
.node-row .ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.node.rfq > .node-row .ic { background: var(--lime-soft); color: var(--lime-ink); }
.node.quote > .node-row .ic { background: var(--blue-soft); color: var(--blue); }
.node.ship > .node-row .ic { background: var(--amber-soft); color: var(--amber); }
.node-row .tx { flex: 1; min-width: 160px; }
.node-row .tx b { font-size: 14px; letter-spacing: .2px; }
.node-row .tx div { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.node-row .amt { color: var(--gold); font-weight: 600; }
.kids { margin: 0 14px 14px 30px; padding-left: 18px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.kids .node { position: relative; }
.kids .node::before { content: ""; position: absolute; left: -20px; top: 27px; width: 18px; border-top: 2px solid var(--line); }
.empty-kid { font-size: 12.5px; color: var(--muted); padding: 10px 2px; position: relative; }
.empty-kid::before { content: ""; position: absolute; left: -20px; top: 20px; width: 14px; border-top: 2px dashed var(--line); }
.empty-box { border: 1.5px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--ink-2); font-size: 13px; }
.empty-box .btn { margin-top: 12px; }
.callout { display: flex; gap: 10px; align-items: flex-start; background: var(--amber-soft); color: #6b4a00; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; }
.callout.ok { background: var(--lime-soft); color: var(--lime-ink); }

/* history */
.hist { display: flex; flex-direction: column; }
.ev { position: relative; padding: 0 0 22px 32px; }
.ev::before { content: ""; position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #c8dcb5; }
.ev::after { content: ""; position: absolute; left: 9.5px; top: 20px; bottom: 4px; border-left: 1px dashed var(--line); }
.ev:last-child::after { display: none; }
.ev .r { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ev b { font-size: 14px; font-weight: 600; }
.ev .meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.ev .cm { background: var(--surface-2); border-radius: 6px; padding: 9px 10px; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.tag { font-size: 11px; border-radius: 6px; padding: 2px 8px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.won { background: var(--lime-soft); border-color: transparent; color: var(--lime-ink); font-weight: 600; }
.tag.link { background: var(--blue-soft); border-color: transparent; color: var(--blue); font-weight: 600; }

/* RFQ / quote */
.rfq-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rfq-title h2 { margin: 0; font-size: 22px; letter-spacing: .3px; }
.subt { color: var(--ink-2); margin-top: 4px; font-size: 13.5px; }
.route { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 10px; padding: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.route .pt { min-width: 0; }
.route .pt small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.route .pt b { font-size: 15px; }
.route .arrow { flex: 1; min-width: 40px; border-top: 2px dashed #c4ccc0; position: relative; }
.linkcard { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); width: 100%; text-align: left; }
.linkcard:hover { border-color: #cfd8c8; }
.linkcard .tx { flex: 1; min-width: 0; }
.linkcard .tx small { display: block; font-size: 11.5px; color: var(--muted); }
.linkcard .tx b { font-size: 14px; }
.qdoc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 18px; }
.qno { font-size: 20px; font-weight: 700; letter-spacing: .4px; }
.lines td.r, .lines th.r { text-align: right; }
.lines table { min-width: 520px; }
.total { display: flex; justify-content: flex-end; gap: 30px; padding: 14px; font-size: 15px; }
.total b { color: var(--gold); font-size: 18px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 30, 16, .38); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; width: min(520px, 100%); max-height: 100%; overflow: auto; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal h3 { margin: 0 0 4px; font-size: 18px; }
.modal .lead { color: var(--ink-2); font-size: 13px; margin: 0 0 18px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); width: 100%; }
.field textarea { min-height: 90px; resize: vertical; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--green); background: #f6fbf1; }
.opt input { margin-top: 3px; accent-color: var(--green); }
.opt b { font-size: 13.5px; }
.opt div div { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.mfoot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
.err { color: var(--red); font-size: 12.5px; margin: -4px 0 12px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--rail); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

/* clickable record IDs */
a.idlink { color: var(--green); font-weight: 600; text-decoration: underline; text-decoration-color: #a9d3ad; text-underline-offset: 3px; letter-spacing: .2px; }
a.idlink:hover { text-decoration-color: var(--green); }
a.chip { cursor: pointer; }
a.chip:hover { filter: brightness(.96); text-decoration: underline; }
.pill.quoted { background: var(--rail); color: #fff; font-weight: 600; }
.pill.ready { background: var(--green-soft); color: var(--green); font-weight: 600; }
.pill.await { background: var(--amber-soft); color: var(--amber); font-weight: 600; }

/* RFQ page (mirrors live RFQ screen) */
.rfq-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.rfq-card .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; padding: 22px 26px 20px; border-bottom: 1px solid var(--line); }
.rfq-card .bd { padding: 24px 26px; }
.f3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 24px; }
.f4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 20px; }
.f3 .k, .f4 .k { font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
.f3 .v, .f4 .v { font-size: 14.5px; overflow-wrap: anywhere; }
.acc { border: 1px solid var(--line); border-radius: 10px; margin-top: 12px; }
.acc summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; font-weight: 600; font-size: 14.5px; }
.acc summary::-webkit-details-marker { display: none; }
.acc[open] summary { border-bottom: 1px solid var(--line); }
.acc[open] summary svg { transform: rotate(180deg); }
.acc .in { padding: 20px 18px; }
.h-sm { font-weight: 600; font-size: 15px; margin: 28px 0 0; }

/* Quotes page (mirrors live Quotes screen) */
.qwrap { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.qlist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.qlist .qh { display: flex; align-items: center; gap: 8px; padding: 16px 16px 10px; }
.qlist .qh span { font-size: 12px; letter-spacing: .8px; color: var(--ink-2); font-weight: 500; margin-right: auto; }
.qtabs { display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; overflow-x: auto; }
.qtabs span { padding: 10px 0; white-space: nowrap; color: var(--ink-2); }
.qtabs span.on { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--rail); }
.qlist .shw { font-size: 12px; color: var(--ink-2); padding: 10px 16px; border-bottom: 1px solid var(--line); }
.qi { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; border-left: 3px solid transparent; }
.qi.on { background: #f1f9e6; border-left-color: #7cc04a; }
.qi .a { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

const money = n => '$' + Math.round(n).toLocaleString('en-US');

const daysAgo = s => Math.round((TODAY - d(s)) / 864e5);

function linkChips(deal) {

/* ---------- routing ---------- */
const ui = { tab: 'pipeline', view: 'board', q: '', owner: '', status: '', date: '' };
function go(hash) { if (location.hash.slice(1) === hash) render(); else location.hash = hash; }
function back() { if (navStack.length > 1) history_back(); else go('pipeline'); }
const navStack = [];
function history_back() { navStack.pop(); const prev = navStack.pop(); go(prev || 'pipeline'); }
window.addEventListener('hashchange', render);
document.addEventListener('click', e => {
  if (e.target.closest('a[href^="#"]')) return; /* plain links route through the hash */
  const g = e.target.closest('[data-go]');
  if (g) { e.stopPropagation(); go(g.dataset.go); }
});

function render() {
  const h = (location.hash.slice(1) || 'pipeline').toLowerCase();
  if (navStack[navStack.length - 1] !== h) navStack.push(h);
  const id = h.toUpperCase();
  const v = $('#view');
  const fin = h === 'finance' || h.startsWith('review-');
  paintChrome(fin);
  if (h === 'finance') { v.innerHTML = financeView(); bindFinance(); }
  else if (h.startsWith('review-') && reviews[id.slice(7)] && dealById(id.slice(7))) { v.innerHTML = reviewView(dealById(id.slice(7))); bindReview(); }
  else if (h.startsWith('op-') && dealById(id)) v.innerHTML = dealView(dealById(id));
  else if (h.startsWith('rfq-') && rfqs[id]) v.innerHTML = rfqView(rfqs[id]);
  else if (h.startsWith('q-') && quotes[id]) v.innerHTML = quoteView(quotes[id]);
  else { v.innerHTML = pipelineView(); bindPipeline(); }
  window.scrollTo(0, 0);
}

/* ---------- pipeline ---------- */
function filtered() {
  const q = ui.q.trim().toLowerCase();
  return deals.filter(x => {
    if (ui.owner && x.owner !== ui.owner) return false;
    if (ui.status === 'open' && x.stage === 'closed') return false;
    if (ui.status === 'won' && x.outcome !== 'won') return false;
    if (ui.status === 'lost' && x.outcome !== 'lost') return false;
    if (ui.date && daysAgo(x.created) > +ui.date) return false;
    if (q) {
      const hay = [x.id, x.name, OWNERS[x.owner].name, x.contact, ...(x.rfqs || []), ...dealQuotes(x)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* Drag a card to another column. Entering Qualified sends the deal to Finance for review; it moves once Finance clears it. */
function moveDeal(id, target) {
  const x = dealById(id);
  if (!x || target === x.stage) return;
  if (isPending(id) && target !== 'closed') return toast(`${x.name} is with Finance for review. It moves to Qualified when Finance clears it.`);
  if (target === 'closed') return closeDealModal(id);
  if (needsKyc(x, target)) return sendFinanceModal(id, { name: x.name, amount: x.amount, cls: x.cls, stage: target });
  applyStage(x, target);
  toast(`${x.name} moved to ${stageLabel(target)}`); render();
}
function stageName(x) { return x.outcome ? (x.outcome === 'won' ? 'Won' : 'Lost') : stageLabel(x.stage); }
function applyStage(x, target, comment, by) {
  const before = stageName(x);
  if (target === 'won' || target === 'lost') {
    x.stage = 'closed'; x.outcome = target;
    if (isPending(x.id)) reviews[x.id].status = 'withdrawn';
    addHistory(x.id, { t: `Deal marked ${target === 'won' ? 'Won' : 'Lost'}`, tag: target === 'won' ? 'Won' : 'Lost', tagCls: target === 'won' ? 'won' : '', comment });
  } else {
    x.stage = target; delete x.outcome;
    addHistory(x.id, { t: `Moved deal from ${before} to ${stageLabel(target)}`, tag: stageLabel(target), comment, ...(by ? { by } : {}) });
  }
}
function closeDealModal(id) {
  const x = dealById(id);

    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="doClose('${id}')">Close deal</button></div>`);
}
function doClose(id) {
  const x = dealById(id), out = document.querySelector('input[name=cl]:checked').value;
  if (out === 'won' && needsKyc(x, 'won')) {
    if (isPending(id)) { closeModal(); return toast(`${x.name} is still with Finance. It can be marked Won once Finance clears it.`); }
    return sendFinanceModal(id, { name: x.name, amount: x.amount, cls: x.cls, stage: 'won', comment: $('#cl-c').value.trim() || undefined });
  }
  applyStage(x, out, $('#cl-c').value.trim() || undefined);
  closeModal(); toast(`${x.name} marked ${out === 'won' ? 'Won' : 'Lost'}`); render();
}
/* Touch screens: press and hold a card, then drag it to a column */
function touchDrag(card) {
  let timer, ghost, active = false, sx, sy;
  const colAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.col'); };
  const clear = () => { document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); };
  card.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(() => {
      active = true; card.classList.add('dragging');
      const r = card.getBoundingClientRect();
      ghost = card.cloneNode(true); ghost.className = 'card ghost';
      Object.assign(ghost.style, { width: r.width + 'px', left: (sx - r.width / 2) + 'px', top: (sy - 30) + 'px' });
      document.body.appendChild(ghost);
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
    }, 350);
  }, { passive: true });
  card.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (!active) { if (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8) clearTimeout(timer); return; }
    e.preventDefault();
    ghost.style.left = (t.clientX - ghost.offsetWidth / 2) + 'px'; ghost.style.top = (t.clientY - 30) + 'px';
    clear(); const c = colAt(t.clientX, t.clientY); if (c) c.classList.add('over');
  }, { passive: false });
  const end = e => {
    clearTimeout(timer);
    if (!active) return;
    e.preventDefault();
    const t = e.changedTouches[0]; const c = colAt(t.clientX, t.clientY);
    active = false; card.classList.remove('dragging'); ghost.remove(); clear();
    if (c) moveDeal(card.dataset.id, c.dataset.stage);
  };
  card.addEventListener('touchend', end); card.addEventListener('touchcancel', end);
}
function bindPipeline() {
  const q = $('#q');
  q.addEventListener('input', () => { ui.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  [['#f-owner', 'owner'], ['#f-status', 'status'], ['#f-date', 'date']].forEach(([s, k]) => $(s).addEventListener('change', e => { ui[k] = e.target.value; render(); }));
  $('#v-board').onclick = () => { ui.view = 'board'; render(); };
  $('#v-list').onclick = () => { ui.view = 'list'; render(); };
  $('#new-deal').onclick = newDealModal;
  document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast('Companies and Contacts are outside this prototype'));
  document.querySelectorAll('.card').forEach(c => {
    c.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === c) go(c.dataset.go); });
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
    c.addEventListener('dragend', () => { c.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
  });
  document.querySelectorAll('.card').forEach(touchDrag);
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); moveDeal(e.dataTransfer.getData('text/plain'), col.dataset.stage); });
  });
}

  const r = reviews[x.id];
  if (!r || x.outcome) return '';
  if (r.status === 'pending') return `<div class="callout">${ICON.warn}<span>With Finance for payment terms review since ${longD(r.sentAt)}. This deal moves to Qualified when Finance clears it. <a href="#review-${x.id.toLowerCase()}">Open customer profile review</a></span></div>`;
  if (r.status === 'returned') return `<div class="callout bad">${ICON.warn}<span><b>Finance sent this deal back:</b> ${esc(r.comment)}</span></div>`;
  return '';
}
function kycPanel(x) {
  const r = reviews[x.id];
  const title = '<p class="sec-t" style="margin:0">Payment terms checklist</p>';
  if (!r || r.status === 'withdrawn') {
    if (!['qualified', 'quote'].includes(x.stage) || x.outcome) return '';
    return `<div class="panel"><p class="sec-t">Payment terms checklist</p>
      <div class="empty-box">Finance has not reviewed this customer yet.<br><button class="btn sm primary" onclick="sendFinanceModal('${x.id}')">Send to Finance</button></div></div>`;
  }
  if (r.status === 'pending') return `<div class="panel">
    <div class="lk-head" style="margin-bottom:16px">${title}<span class="pill review">With Finance</span></div>
    <div class="kv"><div><div class="k">Sent by</div><div class="v">${OWNERS[r.sentBy].name}</div></div><div><div class="k">Sent</div><div class="v tnum">${longD(r.sentAt)} · ${time(r.sentAt)}</div></div>
      <div class="full"><div class="k">Requested payment terms</div><div class="v">${esc(termsText(r))}</div></div></div>
    <div style="margin-top:18px"><a class="btn sm" href="#review-${x.id.toLowerCase()}">Open customer profile review ${ICON.go}</a></div></div>`;
  if (r.status === 'returned') return `<div class="panel">
    <div class="lk-head" style="margin-bottom:16px">${title}<span class="pill back">Sent back</span></div>
    <div class="kyc-meta" style="margin:0 0 12px">${OWNERS[r.reviewedBy].name} · ${longD(r.reviewedAt)} · ${time(r.reviewedAt)}</div>
    <div class="note" style="min-height:0">${esc(r.comment)}</div>
    <div style="margin-top:16px"><button class="btn sm primary" onclick="sendFinanceModal('${x.id}')">Resend to Finance</button></div></div>`;
  return `<div class="panel">
    <div class="lk-head" style="margin-bottom:20px">${title}
      <div style="display:flex;gap:8px;align-items:center"><span class="pill pass">${ICON.check} Cleared by Finance</span><a class="btn sm" href="#review-${x.id.toLowerCase()}">View review</a></div></div>
    <div class="kyc-meta">Cleared by ${OWNERS[r.reviewedBy].name} · ${longD(r.reviewedAt)} · ${time(r.reviewedAt)}</div>
    <div class="kv"><div class="full"><div class="k">Customer classification</div><div class="v">${esc(CLS_LABEL[r.a.cls[0]])}</div></div>
      <div class="full"><div class="k">Requested payment terms</div><div class="v">${esc(termsText(r))}</div></div></div>
    <details class="kyc-all"><summary>View checklist</summary>${checklistSummary(r.a)}</details>
  </div>`;
}

let seq = 23;
function newDealModal() {
  modal(`<h3>New deal</h3><p class="lead">Starts in Prospect. ID: OP-26-11-0${seq}</p>
    <div class="field"><label for="n-n">Company</label><input id="n-n" placeholder="e.g. Dangote Fertilizer"></div>
    <div class="frow"><div class="field"><label for="n-ct">Contact</label><input id="n-ct"></div><div class="field"><label for="n-a">Amount (USD)</label><input id="n-a" type="number" min="0" value="0"></div></div>
    <div class="frow"><div class="field"><label for="n-o">Owner</label><select id="n-o">${Object.entries(OWNERS).map(([k, o]) => `<option value="${k}" ${k === 'NM' ? 'selected' : ''}>${o.name}</option>`).join('')}</select></div>
    <div class="field"><label for="n-c">Class</label><select id="n-c"><option>SME</option><option>Growth</option><option>Enterprise</option></select></div></div>
    <div id="n-err"></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createDeal()">Create deal</button></div>`);
}
function createDeal() {
  const name = $('#n-n').value.trim();
  if (!name) { $('#n-err').innerHTML = '<p class="err">Enter the company name to create the deal.</p>'; return; }
  const id = `OP-26-11-0${seq++}`;
  deals.unshift({ id, name, amount: Math.max(0, +$('#n-a').value || 0), owner: $('#n-o').value, cls: $('#n-c').value, created: '2026-11-06', stage: 'prospect', contact: $('#n-ct').value.trim() || 'Not set', product: 'Not set' });
  closeModal(); toast(`${id} created`); render();
}

render();
</script>
